<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>
    <div>
        <h1>BMI Calculator</h1>

        <form method="POST" action="/">
            <div>
                <label for="weight">Weight (kg):</label>
                <input type="number" step="0.1" id="weight" name="weight" value="{{ weight if weight else '' }}" placeholder="e.g. 70" required>
            </div>
            <div>
                <label for="height">Height (m):</label>
                <input type="number" step="0.01" id="height" name="height" value="{{ height if height else '' }}" placeholder="e.g. 1.75" required>
            </div>
            <button type="submit">Calculate BMI</button>
        </form>

        {% if bmi is not none %}
            <div>
                <h2>Result:</h2>
                <p>Your BMI is <strong>{{ bmi }}</strong></p>
                <p>Category: <strong>{{ category }}</strong></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
